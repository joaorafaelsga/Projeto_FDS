{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico ESG para PMEs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="logo">ESGfy</div>
        <nav>
            <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Início</a>
            <a href="{% url 'quem_somos' %}" class="{% if request.resolver_match.url_name == 'quem_somos' %}active{% endif %}">Quem Somos</a>
            <a href="{% url 'empresa' %}" class="{% if request.resolver_match.url_name == 'empresa' %}active{% endif %}">Sobre a Empresa</a>
            <a href="{% url 'projeto' %}" class="{% if request.resolver_match.url_name == 'projeto' %}active{% endif %}">Sobre o Projeto</a>
            
            <a href="{% url 'cadastrar_empresa' %}" class="{% if request.resolver_match.url_name == 'cadastrar_empresa' %}active{% endif %}">Cadastro de Empresa</a>
            
            <a href="{% url 'fale_conosco' %}" class="{% if request.resolver_match.url_name == 'fale_conosco' %}active{% endif %}">Fale Connosco</a>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 ESGfy. Todos os direitos reservados.</p>
            <div class="social-links">
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
